[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tbot-console"
version = "1.2.0"
description = "Console, process control and shared libraries for tbot units"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.0.0",
    "psutil>=7.0",
]

[project.optional-dependencies]
ibkr = ["ib-async>=2.1.0"]

[project.scripts]
tbot = "tbot_console.control.cli:main"
tbot-web = "tbot_console.web.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0", "pytest-asyncio>=0.24.0", "pytest-cov>=5.0.0", "pytest-mock>=3.14.0",
    "ruff>=0.7.0", "mypy>=1.13.0", "pre-commit>=4.0.0", "types-psutil>=7.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "PTH",
    "ASYNC",
]
ignore = [
    "E501",
    "B008",
    "ARG002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "S101"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = """
    -v
    --strict-markers
    --strict-config
    --cov=src/tbot_console
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
"""
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests with external services",
    "exchange: Exchange-specific tests (may require API keys)",
    "slow: Tests that take significant time to run",
    "public: integration test that runs without API credentials (public endpoints only)",
    "private: integration test that requires valid API credentials",
    "prod_smoke: read-only smoke against the live production public API (scheduled, never in the merge gate)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tbot_console"]
